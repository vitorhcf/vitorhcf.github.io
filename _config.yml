projects:
  - title: Semantic Reconstruction
    description: A ROS 2 package for semantic mapping in domestic environments. The pipeline starts in a Gazebo-simulated environment; when the camera is oriented toward the desired surfaces, object detection and segmentation tools are used (currently YOLO with the COCO dataset, soon to be SAM 3). Based on the 2D segmented images, the system extracts 3D point clouds for each detected class. These point clouds are filtered and reconstructed into 3D meshes using Open3D. The meshes are saved in map coordinates and published as a MarkerArray for visualization in RViz. Different colors are assigned to different object classes in order to distinguish them semantically. This project is still in development for perception and manipulation tasks for RoboCup 2026. Click on 'View Project' to see the repository.
    gif: docs/assets/pcl.gif
    media:
      - docs/assets/yolo.png
      - docs/assets/chair.png
      - docs/assets/table.png
      - docs/assets/reconstruction.png
    link_text: View project
    link_url: https://github.com/vitorhcf/Mesh-Semantic-Mapping 
  - title: AV Gazebo Simulation
    description: Gazebo simulation designed to model sensors, actuators, and the track in order to validate the car's autonomy stack. The work included URDF, Gazebo controllers, a detection model, architecture optimization, sensor design, and calibration.
    gif: docs/assets/gazebotrim.gif
