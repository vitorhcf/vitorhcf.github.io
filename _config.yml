title: Vítor Fonseca
logo: docs/assets/me.vf.png
description: I am a final-year BSc student in Aerospace Engineering at Instituto Superior Técnico (IST Lisboa), where I focus on robotic systems. I am currently a team member of SocRob@Home at the Institute for Systems and Robotics (ISR Lisboa), and I manage the Autonomous Systems department of Técnico Fuel Cell (TFC), a student-led association. My research at ISR focuses on Embodied AI using Visual Language Models (VLMs) and 3D point cloud reconstruction.
