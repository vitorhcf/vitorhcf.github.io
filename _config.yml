projects:
  - title: Semantic Reconstruction
    description: Demo for filtering and surface identification from point clouds generated in simulation. The Open3D pipeline also generates a 3D mesh reconstruction of specific surfaces that are important for manipulation tasks at RoboCup 2026. I am also working on designing and fine-tuning a deep neural network to filter noisy real-world point clouds and perform accurate 3D object detection. The goal is to apply Edge AI techniques so it can run in real time on the robot's local computer.
    gif: docs/assets/pcl.gif
    link_text: View project
    link_url: https://isr.tecnico.ulisboa.pt/projects_cat/irsg/ 
  - title: AV Gazebo Simulation
    description: Gazebo simulation designed to model sensors, actuators, and the track in order to validate the car's autonomy stack. The work included URDF, Gazebo controllers, a detection model, architecture optimization, sensor design, and calibration.
    gif: docs/assets/gazebotrim.gif
    link_text: View project
    link_url: https://tfcell.tecnico.ulisboa.pt/
  - title: Manipulator AMR
    description: Personal project focused on designing an Autonomous Mobile Robot with manipulation capabilities. The goal is to expand my knowledge of reinforcement learning techniques for autonomous driving and manipulation.
