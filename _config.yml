  - title: Autonomous stack development and Gazebo Simulation
    subtitle: TFC (Técnico Fuel Cell) - Autonomous Systems Team
    description: My work included URDF design, Gazebo controllers, detection model implementation and training (with YOLO), sensor fusion and calibration, SLAM optimization, and MPC tuning. I was also responsible for the complete development of the Gazebo simulation, designed to model sensors, actuators, and the racing track to validate the car's autonomy stack in preparation for Shell Eco Marathon 2026 in Poland.
