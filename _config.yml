  - title: VLM ROS2 bridge and optimization
    description: Visual Language Model (Chatrex) ROS 2 bridge. This project demonstrates object detection with real-time performance. The prompt is "Please detect chairs; sofas; sitting people in this image. List each one with a different object index." As shown, the model successfully outputs the bounding boxes for the requested prompt in under 1 second. The process uses cloud AI to run the model and then sends the inference results to the robot running ROS 2.
