  - title: Semantic Reconstruction
    subtitle: ISR (Institute for Systems and Robotics) Lisbon - SocRob@Home Team
    description: ROS 2 semantic mapping package for domestic robots, combining a YOLO-based pipeline and a SAM3-based version, both validated on real robots. It extracts 3D point clouds from segmented images and reconstructs semantic meshes with Open3D for perception and manipulation tasks. I also implemented a lightweight FastAPI-based VLM interface for fast communication with a server.
